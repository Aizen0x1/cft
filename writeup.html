<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writeup | Aizen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="index.html">~/<span>yourname</span></a>
  <nav><a href="index.html#writeups">Writeups</a><a href="index.html#about">About</a></nav>
</div></header>

<main class="article">
  <a class="back" href="index.html#writeups">&lt;- all writeups</a>
  <div id="content">Loading writeup…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(async () => {
  const el = document.getElementById('content');
  const file = new URLSearchParams(location.search).get('file');
  if (!file || file.includes('..') || !file.endsWith('.md')) {
    el.textContent = 'No writeup selected. Go back and pick one.'; return;
  }
  try {
    const url = new URL(file, location.href);
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    el.innerHTML = marked.parse(await res.text());
    el.querySelectorAll('img').forEach(i => { i.src = new URL(i.getAttribute('src'), url).href; });
    el.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    const h1 = el.querySelector('h1');
    if (h1) document.title = h1.textContent + ' | Your Name';
  } catch (e) {
    el.textContent = 'Could not load ' + file + '. Check the path in the link.';
  }
})();
</script>
</body>
</html>
